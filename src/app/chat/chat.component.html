<div class="row">
  <div class="col-4">
    <ul class="list-group">
      <li *ngFor="let group of groups" class="list-group-item"
          [class.active]="group === selectedGroup"
          (click)="selectGroup(group)">
        {{ group.name }}
      </li>
    </ul>
  </div>
  <div class="col-8">
    <div class="border p-2 mb-2" style="height: 300px; overflow-y: auto;">
      <div *ngFor="let msg of selectedGroup.messages">{{ msg }}</div>
    </div>
    <div class="input-group">
      <input [(ngModel)]="newMessage" class="form-control" placeholder="Message">
      <button class="btn btn-primary" (click)="sendMessage()">Envoyer</button>
    </div>
  </div>
</div>
